  <style>
    :root {
      --bg: #0a0a0f;
      --bg-2: #0d0608;
      --text: #f0ede8;
      --muted: rgba(240, 237, 232, 0.72);
      --muted-2: rgba(240, 237, 232, 0.5);
      --mars: #c1440e;
      --mars-light: #d97f3d;
      --mars-bright: #e85a2a;
      --accent-3: #ffaa66;
      --line: rgba(217, 127, 61, 0.22);
      --line-2: rgba(217, 127, 61, 0.12);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 40px rgba(193, 68, 14, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1400px 700px at 20% 5%, rgba(193, 68, 14, 0.14), transparent 45%),
        radial-gradient(1000px 600px at 80% 15%, rgba(217, 127, 61, 0.1), transparent 40%),
        radial-gradient(800px 500px at 50% 90%, rgba(193, 68, 14, 0.08), transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }
    #cosmic-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .top-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      border-radius: 999px;
      background: rgba(10, 10, 15, 0.72);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .top-bar a {
      color: var(--muted-2);
      text-decoration: none;
      font-size: .74rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      line-height: 1;
      transition: all 0.2s ease;
    }
    .top-bar a:hover {
      color: #fff;
      background: rgba(193, 68, 14, 0.2);
    }
    .top-bar a.active {
      color: #fff;
      background: linear-gradient(135deg, var(--mars), var(--mars-light));
      box-shadow: 0 2px 10px rgba(193, 68, 14, 0.45);
    }
    .box {
      position: relative;
      z-index: 2;
      max-width: 580px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(14, 14, 20, 0.8) 0%, rgba(20, 10, 12, 0.65) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 46px 36px;
      margin: 40px auto;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .box:hover {
      border-color: rgba(217, 127, 61, 0.38);
    }
    .logo-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #000000;
      border: 1px solid var(--line);
      box-shadow: 0 0 24px rgba(193, 68, 14, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo {
      height: 52px;
      width: auto;
      display: block;
      transition: transform 0.3s ease;
    }
    .logo-wrap:hover .logo {
      transform: scale(1.08);
    }
    .eyebrow {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--accent-3);
      margin-bottom: 14px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(217, 127, 61, 0.35);
    }
    h1 {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 2rem;
      margin-bottom: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #ffffff 40%, #ffaa66 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(193, 68, 14, 0.3);
    }
    p.lead {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 0;
      font-size: 1.02rem;
    }
    .links {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
    }
    a.action {
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, var(--mars), var(--mars-light));
      padding: 15px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: .95rem;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(193, 68, 14, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    a.action:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(193, 68, 14, 0.45);
      background: linear-gradient(135deg, var(--mars-bright), #ffaa66);
    }
    a.action.secondary {
      background: rgba(193, 68, 14, 0.08);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    a.action.secondary:hover {
      background: rgba(193, 68, 14, 0.16);
      border-color: var(--mars-light);
      box-shadow: 0 0 24px rgba(193, 68, 14, 0.25);
    }
    .badge-footer {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--line-2);
      font-size: .75rem;
      color: var(--muted-2);
      letter-spacing: .04em;
    }
    @media (max-width: 600px) {
      .top-bar {
        position: static;
        margin-bottom: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .box {
        padding: 34px 22px;
      }
      h1 { font-size: 1.7rem; }
      p.lead { font-size: .95rem; }
    }
  </style>
